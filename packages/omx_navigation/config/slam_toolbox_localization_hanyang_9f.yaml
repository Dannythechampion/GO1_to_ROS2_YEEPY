slam_toolbox:
  ros__parameters:
    use_sim_time: false
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    # Without this the node runs on the default 8 MB stack and segfaults while
    # matching against a deserialized posegraph. On 2026-10-25 the localization
    # node died with exit code -11 twice: once seconds after loading the map
    # (session 092530Z) and once 410 s into the first armed drive (session
    # 102846Z), both with healthy /scan input. slam_toolbox's own reference
    # config sets the same value -- see
    # /opt/ros/humble/share/slam_toolbox/config/mapper_params_localization.yaml
    # ("program needs a larger stack size to serialize large maps"). Our mapping
    # config carried it; this one did not, and RewrittenYaml only rewrites
    # map_file_name, odom_frame, base_frame and scan_topic, so nothing supplied
    # it at launch.
    stack_size_to_use: 40000000
    mode: localization
    # RewrittenYaml replaces this installed-map default with posegraph:= at launch.
    map_file_name: /mnt/t500/go1_ros2_project/maps/hanyang_9f/20260728_204825/slam_toolbox/hanyang_9f
    map_start_pose: [0.0, 0.0, 0.0]
    map_frame: map
    odom_frame: camera_init
    base_frame: body_nav
    scan_topic: /scan
    transform_publish_period: 0.05
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    scan_queue_size: 1
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    minimum_time_interval: 0.1
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10
    use_scan_matching: true
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    fine_search_angle_offset: 0.00349
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    do_loop_closing: false
